schema: 6
name: dll-loader

build:
  payloads:
    shellcode:
      source: "$args.0$"

  stub:
    syscalls:
      mode: indirect
      resolver: hells_gate
    strings:
      strategy: xor

  output:
    path: ./dist/dll-loader.dll
    kind: dll
    entry: auto

runtime:
  - technique: reflective_loading
