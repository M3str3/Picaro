# Process hollowing: the payload runs inside a freshly created, suspended
# `svchost.exe` instead of the packed binary's own process.
#
#   cargo run -- build examples/plans/process-hollowing.yaml
#   .\dist\test_packed.exe

schema: 4
name: process-hollowing

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_packed.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: process_hollowing
    params:
      target: "C:\\Windows\\System32\\svchost.exe"
