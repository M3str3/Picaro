# Payload runtime arguments in `join` mode (the default): the YAML `args` come
# first, then whatever arguments the packed binary is invoked with.
#
#   powershell -ExecutionPolicy Bypass -File examples/payloads/build_args_payload.ps1
#   cargo run -- build examples/plans/args.yaml
#   .\dist\test_args_join.exe "runtime-c" "runtime-d"
#
# The payload sees: <exe> yaml-a yaml-b runtime-c runtime-d
# (token 0 is the executable name, not an argument).
#
# `args_mode: override` instead makes the runtime args replace the YAML args
# entirely (with no runtime argument, the YAML args still apply).

schema: 4
name: args

build:
  payload:
    source: ./examples/payloads/test_args_payload.exe
    args:
      - "yaml-a"
      - "yaml-b"
    args_mode: join
    crypto:
      algo: xchacha20poly1305
      key: random
  output:
    path: ./dist/test_args_join.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: reflective_loading
