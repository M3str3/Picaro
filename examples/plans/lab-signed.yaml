# A lab-signed build: packs the test payload, embeds a VERSIONINFO and signs the
# artifact with an automatically generated self-signed certificate chain.
#
#   cargo run -- build examples/plans/lab-signed.yaml
#
# The CA's public certificate is written into the bundle's provenance folder,
# `packed/lab-signed-<run>/artifacts/lab_signed.ca.cer`; install it in a lab
# machine's *Trusted Root Certification Authorities* to make the signature
# verify there. Nothing is added to this machine's trust stores.
#
# Signing works with `signtool` (Windows) and `osslsigncode` (Linux, including
# the Docker image), so the same plan signs on either platform.

schema: 6
name: lab-signed

build:
  payloads:
    payload:
      source: ./examples/payloads/test_payload.exe

  output:
    path: ./dist/lab_signed.exe
    resources:
      version_info:
        company: "Contoso Ltd"
        product: "Widget"
        description: "Widget Helper"
        file_version: "1.0.0.0"
    sign:
      mode: lab

runtime:
  - technique: reflective_loading
