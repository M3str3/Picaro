# Reflective loading: the payload is mapped and executed inside the packed
# binary's own process (no suspended target, no executable image on disk).
#
#   cargo run -- build examples/plans/reflective-loading.yaml
#   .\dist\test_packed_reflective.exe

schema: 6
name: reflective-loading

build:
  payloads:
    payload:
      source: ./examples/payloads/test_payload.exe
  output:
    path: ./dist/test_packed_reflective.exe

runtime:
  - technique: reflective_loading
