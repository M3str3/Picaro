schema: 1
name: test-amsi-patch

input:
  path: ./examples/payloads/test_payload.exe

payload:
  crypto:
    algo: xchacha20poly1305
    key: random
  strings:
    strategy: xor
    key: random

pipeline:
  - technique: patch_amsi
  - technique: reflective_loading

output:
  path: ./dist/test_amsi_patch.exe
  arch: x64
  strip: true
  trim_paths: all
