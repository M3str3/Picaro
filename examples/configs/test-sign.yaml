schema: 4
name: test-sign

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  output:
    path: ./dist/test_sign.exe
    arch: x64
    strip: true
    trim_paths: all
    sign:
      mode: lab
      subject: "CN=batesian lab"

runtime:
  - technique: reflective_loading
