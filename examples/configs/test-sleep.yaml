schema: 2
name: test-sleep

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  strings:
    strategy: xor
    key: random
  output:
    path: ./dist/test_sleep.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: sleep_obfuscation
    variant: ekko
    sleep_ms: 5000
    encrypt_regions: [payload]
  - technique: reflective_loading
