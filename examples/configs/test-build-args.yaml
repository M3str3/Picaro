# Example: positional build arguments (`$build.N$`).
# Usage:
#   batesian build examples/configs/test-build-args.yaml \
#     "C:\\Windows\\System32\\svchost.exe" ./dist/custom.exe
schema: 1
name: test-build-args

input:
  path: ./examples/payloads/test_payload.exe

payload:
  crypto:
    algo: xchacha20poly1305
    key: random

pipeline:
  - technique: process_hollowing
    target: "$build.0$"

output:
  path: "$build.1$"
  arch: x64
  strip: true
  trim_paths: all
