# Example: positional build arguments (`$arg.N$`).
# Usage:
#   batesian build examples/configs/test-build-args.yaml \
#     "C:\\Windows\\System32\\svchost.exe" ./dist/custom.exe
schema: 4
name: test-build-args

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  output:
    path: "$arg.1$"
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: process_hollowing
    params:
      target: "$arg.0$"
