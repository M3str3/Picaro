# Example: custom loader stub (`loader:` block).
# Usage:
#   packerman build examples/configs/test-custom-stub.yaml
#
# `examples/stubs/minimal.rs` ignores the technique blocks, so the packer
# emits a warning (not an error) and produces a stub that only prints the
# payload size.
schema: 1
name: test-custom-stub

input:
  path: ./examples/payloads/test_payload.exe

payload:
  crypto:
    algo: xchacha20poly1305
    key: random

pipeline:
  - technique: reflective_loading

loader:
  path: ./examples/stubs/minimal.rs

output:
  path: ./dist/test_custom_stub.exe
  arch: x64
  strip: true
  trim_paths: all
