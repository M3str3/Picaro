schema: 4
name: test-etw-anti-debug

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_etw_anti_debug.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: anti_debug
    params:
      action: abort
  - technique: patch_etw
    params:
      full: true
  - technique: reflective_loading
