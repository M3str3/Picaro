schema: 1
name: test-msgbox-stack

input:
  path: ./examples/payloads/test_payload.exe

payload:
  crypto:
    algo: xchacha20poly1305
    key: random
  strings:
    strategy: stack

pipeline:
  - technique: process_hollowing
    target: "C:\\Windows\\System32\\svchost.exe"

output:
  path: ./dist/test_packed_stack.exe
  arch: x64
  strip: true
  trim_paths: all
