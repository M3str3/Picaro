schema: 4
name: test-bouncer-full

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_bouncer_full.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  # Every check declared, none of them `false`: the gate only runs the payload
  # when the host matches all of them (`mode: all`).
  - technique: bouncer
    params:
      mode: all
      on_fail: silent
      hostname: "WORKSTATION-*"
      username: "admin"
      domain: "CORP"
      language: ["en-US", "es-ES"]
      keyboard: ["0409", "0C0A"]
      not_in_vm: true
      not_in_sandbox: true
      min_uptime_min: 10
      min_ram_mb: 4096
  - technique: reflective_loading
