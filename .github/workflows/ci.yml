name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting and lints run on Linux: the packer itself is host-independent
  # (only the *generated* stub is Windows-only, and it is emitted as a string).
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # The build compiles a Rust stub per technique, so it needs a Windows host
  # (the stub targets x86_64-pc-windows-msvc and links the `windows` import lib).
  test:
    name: tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fast suite
        run: cargo test
      # The ignored suite is the safety net: it compiles a stub per technique
      # and asserts no sensitive literal leaks into the binary, plus the IAT
      # reductions from the syscall layer. `--test-threads=1` keeps the tests
      # that share `build/` from racing.
      #
      # The four tests that *execute* a packed binary are skipped: Windows
      # Defender (active on the runner) flags the artifacts and blocks them, so
      # they only pass on a host where Defender is disabled. Run them locally
      # with `cargo test -- --ignored`.
      - name: Slow suite (compiles a stub per technique)
        run: >
          cargo test -- --ignored --test-threads=1
          --skip indirect_syscalls_binary_runs_on_windows
          --skip bouncer_gate_blocks_and_allows_on_windows
          --skip payload_receives_yaml_then_runtime_args
          --skip payload_override_mode_prefers_runtime_args
