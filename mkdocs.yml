site_name: picaro
site_description: Declarative PE packer for authorized red team research

docs_dir: docs
site_dir: site
# `false` keeps every page at `<name>.html` (no per-page directories), so the
# generated `site/index.html` and its relative links also work when opened
# straight from disk. Search still needs the served site.
use_directory_urls: false

theme:
  name: material
  language: en
  # Square brand mark shown in the nav header and as the favicon; the file
  # lives in docs/assets/ so MkDocs copies it into the built site.
  logo: assets/picaro_logo.png
  favicon: assets/picaro_logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Sidebar typography tweaks: quieter group headers and more space between groups.
extra_css:
  - stylesheets/extra.css

# A deliberately small navigation: only what an operator needs to build, run and
# understand an artifact. The per-technique pages pull the READMEs in with
# `pymdownx.snippets`, so the Markdown stays the single source of truth.
nav:
  - Home: index.md
  - Getting started:
    - Getting started: getting-started.md
    - Plan: plan.md
    - Examples: examples/index.md
  - Loader features:
    - Overview: features/index.md
    - Direct/Indirect syscalls: features/ref/syscalls.md
    - API Proxy wrapper: features/ref/api_resolution.md
    - String obfuscation: features/ref/strings.md
    - Console args: features/ref/args.md
    - Adding a feature: features/adding-a-feature.md
  - Hosts:
      - Host catalogue: hosts.md
  - Techniques:
      - Overview: techniques/index.md
      - AMSI Patch: techniques/ref/patch_amsi.md
      - ETW Patch: techniques/ref/patch_etw.md
      - Anti-debug: techniques/ref/anti_debug.md
      - Sleep obfuscation: techniques/ref/sleep_obfuscation.md
      - Bouncer: techniques/ref/bouncer.md
      - Unhook ntdll: techniques/ref/unhook_ntdll.md
      - Process hollowing: techniques/ref/process_hollowing.md
      - Reflective loading: techniques/ref/reflective_loading.md
      - .NET hosting: techniques/ref/dotnet_hosting.md
      - Execution callbacks: techniques/ref/execution_callbacks.md
      - Module stomping: techniques/ref/module_stomping.md
      - Fibers: techniques/ref/fibers.md
      - Early bird: techniques/ref/early_bird.md
      - PE injection: techniques/ref/pe_injection.md
      - Thread hijacking: techniques/ref/thread_hijacking.md
      - Living off the land: techniques/ref/living_off_the_land.md
      - Sleep: techniques/ref/sleep.md
      - Self-deletion: techniques/ref/self_deletion.md
      - Stack spoofing: techniques/ref/stack_spoofing.md
      - PPID spoofing: techniques/ref/ppid_spoofing.md
      - Adding a technique: techniques/adding-a-technique.md
  - Architecture:
      - How it fits together: architecture.md
      - Runtime steps: multistage.md
      - Custom stubs: custom-stubs.md
      - Syscall layer design: design/syscalls.md
      - API resolution design: design/api-resolution.md
      - DLL output design: design/dll-output.md
      - x86 support: x86.md
  - Reference:
      - Measurements: measurements.md
      - Process hollowing evidence: techniques/process_hollowing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # Pulls the per-technique READMEs, the README plan section and the examples
  # README in, so the Markdown stays the single source of truth. Paths are
  # relative to the repo root; `check_paths` fails the build if one is missing.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
