schema: 4
name: test-amsi-patch

build:
  payload:
    source: ./examples/payloads/test_payload.exe
    crypto:
      algo: xchacha20poly1305
      key: random
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_amsi_patch.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  - technique: patch_amsi
  - technique: reflective_loading
