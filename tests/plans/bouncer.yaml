schema: 6
name: test-bouncer

build:
  crypto:
    algo: xchacha20poly1305
    key: random
  payloads:
    payload:
      source: ./examples/payloads/test_payload.exe
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_bouncer.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  # Always accepts the host (`*` matches any computer name), so the payload runs.
  - technique: bouncer
    params:
      require:
        - hostname: "*"
  - technique: reflective_loading
    params: { payload: payload }
