schema: 6
name: test-invalid-order

build:
  crypto:
    algo: xchacha20poly1305
    key: random
  payloads:
    payload:
      source: ./examples/payloads/test_payload.exe
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_invalid_order.exe
    arch: x64
    strip: true
    trim_paths: all

# `reflective_loading` of a PE executable is terminal, so it can only be the
# last step; validation rejects this plan.
runtime:
  - technique: reflective_loading
    params: { payload: payload }
  - technique: patch_amsi
