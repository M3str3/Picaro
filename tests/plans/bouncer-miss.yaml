schema: 6
name: test-bouncer-miss

build:
  crypto:
    algo: xchacha20poly1305
    key: random
  payloads:
    payload:
      source: ./examples/payloads/test_payload.exe
  stub:
    strings:
      strategy: xor
      key: random
  output:
    path: ./dist/test_bouncer_miss.exe
    arch: x64
    strip: true
    trim_paths: all

runtime:
  # No host can ever be named this, so the gate always rejects the host and the
  # payload never runs.
  - technique: bouncer
    params:
      mode: all
      on_fail: silent
      hostname: "picaro-no-such-host-*"
  - technique: reflective_loading
    params: { payload: payload }
