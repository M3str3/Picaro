[package]
name = "picaro"
version = "0.1.0"
edition = "2021"
description = "Declarative PE packer for authorized red team research"
license = "MIT"

[dependencies]
# Serialization/deserialization with `derive` and YAML support.
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
# JSON output for `audit --json` and the build manifest.
serde_json = "1"
# SHA-256 for build provenance and `build.payload.sha256` pinning.
sha2 = "0.10"
# Authenticated payload encryption: ChaCha20-Poly1305.
chacha20poly1305 = "0.10"
# CSPRNG for keys and nonces (`std_rng` enables `thread_rng`).
rand = { version = "0.8", features = ["std_rng"] }
# Hex encoding for readable key/nonce output.
hex = "0.4"
# Regex matching for the static audit's string scan.
regex = "1"
# In-memory HTTP(S) fetch of the input payload (URL input).
ureq = { version = "2.12", features = ["tls"] }
# Declarative CLI (`picaro build plan.yaml`).
clap = { version = "4", features = ["derive"] }
# Typed errors; we avoid `panic!` and `unwrap` in the main flow.
thiserror = "2"
# Terminal colors. `anstream` strips escapes when the stream cannot render
# them and enables virtual-terminal processing on Windows consoles.
# `anstyle` defines the styles; both are already in the tree via `clap`.
anstream = "1"
anstyle = "1"
# Interactive prompts (arrow-key menus, checkbox multi-select, confirmations)
# for `picaro build interactive`. Used only when stdin/stdout is a terminal;
# scripted/redirected input falls back to a plain line reader.
inquire = "0.7"
# Windows FFI (windows-rs). Only the generated stub uses it, but it is declared
# here so its .rlib is available under target/ for `rustc --extern`.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # CreateProcessA takes SECURITY_ATTRIBUTES.
    "Win32_Security",
    # Process hollowing: VirtualAllocEx + memory constants.
    "Win32_System_Memory",
    # Process hollowing: Read/WriteProcessMemory, Get/SetThreadContext.
    "Win32_System_Diagnostics_Debug",
    # The x64 CONTEXT struct lives here (gates Get/SetThreadContext).
    "Win32_System_Kernel",
    # GetModuleHandleA/GetProcAddress to resolve ntdll exports dynamically.
    "Win32_System_LibraryLoader",
    # PE structures for reflective loading (IMAGE_DOS_HEADER, IMAGE_IMPORT_DESCRIPTOR, ...).
    "Win32_System_SystemServices",
    # IMAGE_NT_HEADERS64 pulls IMAGE_FILE_MACHINE (its FileHeader.Machine field).
    "Win32_System_SystemInformation",
    # IMAGE_THUNK_DATA64 for reflective import resolution.
    "Win32_System_WindowsProgramming",
    # Bouncer: GetUserDefaultLocaleName (T1614).
    "Win32_Globalization",
    # Bouncer: GetKeyboardLayout* (T1614).
    "Win32_UI_Input_KeyboardAndMouse",
    # Bouncer: CreateToolhelp32Snapshot + PROCESSENTRY32W (T1497).
    "Win32_System_Diagnostics_ToolHelp",
] }
