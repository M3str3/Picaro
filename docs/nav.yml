# Picaro — documentation navigation (single source of truth).
#
# This file holds only the navigation, which two consumers read:
#   1. `docs/site/scripts/assemble-docs.mjs`, which generates the Starlight
#      sidebar from it when the site is built.
#   2. the Rust tests `every_technique_is_documented` / `every_feature_is_documented`
#      in `src/techniques/mod.rs` / `src/features/mod.rs`, which assert that every
#      registered technique/feature has a `techniques/ref/<name>.md` /
#      `features/ref/<name>.md` entry here.
#
# Every entry is `label: <path>` where the path is relative to `docs/`. A page
# whose only content is `--8<-- "src/…/README.md"` is rendered straight from that
# README at build time, so the technique/feature docs are the same Markdown as the
# source — never a copy that can drift.

nav:
  - Home: index.md
  - Getting started:
    - Getting started: getting-started.md
    - Plan: plan.md
    - Plan builder: /plan-builder/
    - Examples: examples/index.md
  - Loader features:
    - Overview: features/index.md
    - Adding a feature: features/adding-a-feature.md
  - Hosts:
    - Host programs: hosts.md
  # The technique pages under techniques/ref/ are NOT listed here: the site
  # sidebar groups and badges them from the registry at assemble time, and the
  # assembler copies `src/techniques/<name>/README.md` into a page for each. The
  # Rust tests assert that each technique has a `techniques/ref/<name>.md` page.
  - Techniques:
    - Overview: techniques/index.md
    - Adding a technique: techniques/adding-a-technique.md
  - Architecture:
    - How it fits together: architecture.md
    - Runtime steps: multistage.md
    - Custom stubs: custom-stubs.md
    - Syscall layer design: design/syscalls.md
    - API resolution design: design/api-resolution.md
    - DLL output design: design/dll-output.md
    - Polymorphism: design/polymorphism.md
    - Network stager design: design/network-stager.md
    - x86 support: x86.md
  - Reference:
    - Measurements: measurements.md
    - Process hollowing evidence: techniques/process_hollowing.md
